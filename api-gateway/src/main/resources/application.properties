# Application Configuration
spring.application.name=API-GATEWAY
server.port=8091

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# JWT Secret
jwt.secret=ApexCareSecretKeyForJwtTokenGenerationMustBeAtLeast256BitsLongForHS256Algorithm2026

# Auth Service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

# Patient Service
spring.cloud.gateway.routes[1].id=patient-service
spring.cloud.gateway.routes[1].uri=lb://PATIENT-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/patients/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1

# Appointment Service
spring.cloud.gateway.routes[2].id=appointment-service
spring.cloud.gateway.routes[2].uri=lb://APPOINTMENT-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/appointments/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1

# Billing Service
spring.cloud.gateway.routes[3].id=billing-service
spring.cloud.gateway.routes[3].uri=lb://BILLING-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/bills/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=1

# Driver Service - Round Robin Load Balancing
spring.cloud.gateway.routes[4].id=driver-service
spring.cloud.gateway.routes[4].uri=lb://DRIVER-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/rider
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=1

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG